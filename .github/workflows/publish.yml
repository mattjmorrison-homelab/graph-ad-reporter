name: Publish

on:
  pull_request:
    types: [closed]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Promote the PR's already-built image to the deployed tag
        uses: mattjmorrison-homelab/actions-k8s@955b466878ae777505b822bb6c241f4f4e6805b5 # main
        with:
          service-account: graph-ad-reporter-job
          image: gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
          shell: "false"
          command: >-
            tag registry.morrisons.site/graph-ad-reporter:pr-${{ github.event.pull_request.head.sha }}
            ${{ github.event.pull_request.head.sha }}
          env: DOCKER_CONFIG=/kaniko/.docker
          secret-volume: graph-ad-reporter-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "120"

      - run: sh scripts/verify-deploy.sh
        env:
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Fetch GitHub dispatch token
        uses: mattjmorrison-homelab/actions-openbao@dc591bde3eb71f6c6523c700060facbf6e06b362 # main
        with:
          role: graph-ad-reporter-dispatch
          kv-path: homelab/graph-router/github-dispatch-token
          output-name: GITHUB_DISPATCH_TOKEN

      - name: Trigger graph-router rebuild
        uses: mattjmorrison-homelab/actions-workflow-dispatch@82e99382b6544893cfc25f358191f2ea5a0029b4 # main
        with:
          repo: mattjmorrison-homelab/graph-router
          workflow: publish.yml
          token: ${{ env.GITHUB_DISPATCH_TOKEN }}

      - name: Notify Discord on failure
        if: failure()
        uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: graph-ad-reporter-discord
          kv-path: homelab/service/admin-discord/graph-ad-reporter/webhook-url
          output-name: DISCORD_WEBHOOK_URL
      - if: failure()
        run: >-
          curl -sf -H "Content-Type: application/json" -X POST
          -d "{\"content\": \"🔴 **graph-ad-reporter** build failed — ${{ github.event.pull_request.head.sha }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          "$DISCORD_WEBHOOK_URL"
